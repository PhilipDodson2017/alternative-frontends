<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
:root{
  --bg:#000000;
  --fg:#ffffff;
  --muted:#8a8a8a;
  --tile-bg:#ffffff;
  --tile-border:none;
  --tile-shadow:0 4px 14px rgba(255,255,255,.08);
  --accent:#ffde00;
  --input-bg:#000000;
  --input-fg:#ffffff;
  --input-border:#ffffff;
  --modal-bg:#000000;
  --overlay:rgba(0,0,0,.75);
  --danger:#ff3b30;
}
body.theme-light{
  --bg:#ffffff;
  --fg:#000000;
  --muted:#555555;
  --tile-bg:#ffffff;
  --tile-border:3px solid #000000;
  --tile-shadow:0 4px 12px rgba(0,0,0,.12);
  --accent:#0057ff;
  --input-bg:#ffffff;
  --input-fg:#000000;
  --input-border:#000000;
  --modal-bg:#ffffff;
  --overlay:rgba(0,0,0,.4);
  --danger:#d70015;
}
body.yt-mode{
  --accent:#ff0000;
  --danger:#ff0000;
}
body.yt-mode .wordmark span{color:#ff0000}
body.yt-mode .hint{display:none}
body.yt-mode #ytHint{display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;
  flex-direction:column;
  min-height:100%;
  transition:background .15s,color .15s;
}
header#menu{
  padding:26px 24px 10px;
}
.menu-row{
  display:flex;
  gap:18px;
  overflow-x:auto;
  padding-bottom:12px;
  scrollbar-width:thin;
}
.menu-row::-webkit-scrollbar{height:6px}
.menu-row::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}
.tile{
  flex:0 0 auto;
  width:108px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  cursor:pointer;
  position:relative;
  user-select:none;
  -webkit-user-select:none;
}
.tile .icon{
  width:96px;
  height:96px;
  border-radius:22px;
  background:var(--tile-bg);
  border:var(--tile-border);
  box-shadow:var(--tile-shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:transform .12s ease;
}
.tile:hover .icon{transform:scale(1.06)}
.tile .icon img{width:100%;height:100%;object-fit:contain;padding:10px;display:block}
.tile .label{
  max-width:108px;
  font-size:13px;
  font-weight:600;
  color:var(--fg);
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.tile.add .icon{
  background:transparent;
  border:3px dashed var(--fg);
  box-shadow:none;
  color:var(--fg);
  font-size:52px;
  font-weight:300;
  line-height:1;
}
.tile .tool{
  position:absolute;
  top:2px;
  width:26px;
  height:26px;
  border-radius:50%;
  border:2px solid var(--fg);
  background:var(--bg);
  color:var(--fg);
  font-weight:700;
  font-size:13px;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:2;
}
.tile:hover .tool{display:flex}
.tile .tool.edit{right:8px}
.tile .tool.delete{left:8px;color:var(--danger);border-color:var(--danger)}
main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.search-wrap{
  width:100%;
  max-width:640px;
  text-align:center;
}
.wordmark{
  font-size:64px;
  font-weight:700;
  letter-spacing:-2px;
  margin-bottom:26px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.wordmark span:nth-child(1){color:#4285f4}
.wordmark span:nth-child(2){color:#ea4335}
.wordmark span:nth-child(3){color:#fbbc05}
.wordmark span:nth-child(4){color:#4285f4}
.wordmark span:nth-child(5){color:#34a853}
.wordmark span:nth-child(6){color:#ea4335}
#searchForm{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  align-items:center;
  justify-content:center;
}
#q{
  flex:1;
  padding:16px 22px;
  font-size:20px;
  color:var(--input-fg);
  background:var(--input-bg);
  border:3px solid var(--input-border);
  border-radius:999px;
  outline:none;
  min-width:0;
  max-width:452px;
}
#q::placeholder{color:var(--muted)}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%, transparent)}
.wheel{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:var(--input-bg);
  border:3px solid var(--input-border);
  border-radius:999px;
  padding:4px;
}
.wheel-seg{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-radius:999px;
  border:2px solid transparent;
  background:transparent;
  color:var(--muted);
  font:inherit;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  transition:background .12s,color .12s,transform .12s;
}
.wheel-seg:hover{color:var(--fg)}
.wheel-seg.active{
  background:var(--accent);
  color:var(--bg);
  transform:scale(1.05);
}
.wheel-seg .wicon{display:inline-flex;align-items:center}
.wheel-seg .wlabel{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
}
.wheel-seg:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{margin-top:22px;font-size:12px;color:var(--muted);letter-spacing:.5px}
#ytHint{
  display:none;
  margin-top:10px;
  font-size:12px;
  color:var(--accent);
  letter-spacing:.5px;
}
#toast{
  position:fixed;
  bottom:26px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--fg);
  color:var(--bg);
  border-radius:999px;
  padding:12px 22px;
  font-size:14px;
  font-weight:600;
  text-align:center;
  max-width:90vw;
  width:max-content;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:100;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{
  padding:14px 24px 22px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
footer button{
  padding:8px 14px;
  font-size:13px;
  font-weight:600;
  color:var(--fg);
  background:transparent;
  border:2px solid var(--muted);
  border-radius:999px;
  cursor:pointer;
}
footer button:hover{border-color:var(--fg)}
footer button.danger:hover{border-color:var(--danger);color:var(--danger)}
#modal,#homeModal{
  position:fixed;
  inset:0;
  background:var(--overlay);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:16px;
}
#modal.open,#homeModal.open{display:flex}
.modal-box{
  background:var(--modal-bg);
  color:var(--fg);
  border:3px solid var(--fg);
  border-radius:18px;
  width:100%;
  max-width:460px;
  padding:26px;
}
.modal-box h2{font-size:22px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:6px;
  color:var(--muted);
}
.field input[type=text]{
  width:100%;
  padding:12px 14px;
  font-size:15px;
  color:var(--fg);
  background:var(--bg);
  border:2px solid var(--fg);
  border-radius:10px;
  outline:none;
}
.field input[type=text]:focus{border-color:var(--accent)}
.field .file-row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.file-row input[type=file]{font-size:13px;color:var(--muted)}
.preview{
  width:64px;height:64px;
  border-radius:12px;
  border:2px solid var(--fg);
  overflow:hidden;
  display:none;
  align-items:center;
  justify-content:center;
  background:var(--tile-bg);
}
.preview img{width:100%;height:100%;object-fit:contain;padding:6px;display:block}
#imageUrl{
  margin-top:8px;
}
.modal-actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:22px;
}
.modal-actions button{
  padding:11px 20px;
  font-size:15px;
  font-weight:700;
  border:none;
  border-radius:999px;
  cursor:pointer;
}
#saveLink,#copyHome{background:var(--accent);color:var(--bg)}
#cancelLink,#closeHome{background:transparent;color:var(--fg);border:2px solid var(--fg)}
#homeModal .modal-box{max-height:100%;overflow-y:auto}
.home-note{font-size:14px;line-height:1.5;color:var(--muted);margin-bottom:16px}
.home-steps{margin:0 0 4px 20px;font-size:15px;line-height:1.5}
.home-steps li{margin-bottom:6px}
.home-steps code,.home-other code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.home-other{margin-top:14px;font-size:14px;color:var(--muted)}
.home-other summary{cursor:pointer;font-weight:700}
.home-other p{margin-top:10px;line-height:1.5}
.home-other b{color:var(--fg)}
@media (max-width:520px){
  .wordmark{font-size:46px}
  #searchForm{flex-direction:column}
  .wheel{width:100%;justify-content:center}
}
@media (min-width:768px){.search-wrap{max-width:820px}}
@media (min-width:1024px){.search-wrap{max-width:980px}}
@media (min-width:1440px){.search-wrap{max-width:1120px}}
@media (min-width:1920px){#q{max-width:533px}}

/* View control (focus mode) */
[hidden]{display:none!important}
header#menu{position:relative;display:flex;align-items:flex-start;gap:12px}
.menu-row{flex:1 1 auto;min-width:0}
#viewBtn{
  flex:0 0 auto;
  width:44px;height:44px;
  margin-left:auto;
  padding:0;
  border-radius:50%;
  border:2px solid var(--muted);
  background:transparent;
  color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:border-color .12s,color .12s;
}
#viewBtn:hover{border-color:var(--fg)}
#viewBtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
#viewBtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#viewPanel{
  position:absolute;
  top:100%;right:24px;
  z-index:40;
  width:264px;
  max-width:calc(100vw - 32px);
  background:var(--modal-bg);
  color:var(--fg);
  border:2px solid var(--fg);
  border-radius:16px;
  padding:12px 10px 10px;
  display:flex;flex-direction:column;gap:2px;
  box-shadow:0 12px 30px rgba(0,0,0,.45);
}
#viewPanel:focus{outline:none}
#viewTitle{
  font-size:13px;
  font-weight:700;
  color:var(--muted);
  margin:2px 10px 8px;
}
.view-switch{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;min-height:44px;
  padding:8px 10px;
  border:0;border-radius:10px;
  background:transparent;
  color:var(--fg);
  font:inherit;font-size:15px;font-weight:400;text-align:left;
  cursor:pointer;
  transition:background-color .12s;
}
.view-switch:hover{background:color-mix(in srgb,var(--fg) 12%,transparent)}
.view-switch:focus-visible{outline:3px solid var(--accent);outline-offset:-1px}
.view-switch .sw{
  flex:0 0 auto;
  width:24px;height:24px;
  border-radius:7px;
  border:2px solid var(--muted);
  display:flex;align-items:center;justify-content:center;
  color:var(--bg);
  transition:background-color .12s,border-color .12s;
}
.view-switch .sw svg{display:none}
.view-switch[aria-checked="true"] .sw{background:var(--accent);border-color:var(--accent)}
.view-switch[aria-checked="true"] .sw svg{display:block}
.presets{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.preset{
  min-height:44px;
  padding:9px 14px;
  border-radius:999px;
  border:2px solid var(--muted);
  background:transparent;
  color:var(--fg);
  font:inherit;font-size:14px;font-weight:600;text-align:left;
  cursor:pointer;
  transition:background-color .12s,border-color .12s,color .12s;
}
.preset:hover{border-color:var(--fg)}
.preset:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.preset[data-active="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.mic{
  flex:0 0 auto;
  width:54px;height:54px;
  padding:0;
  border-radius:50%;
  border:3px solid var(--input-border);
  background:var(--input-bg);
  color:var(--fg);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:border-color .12s,color .12s;
}
.mic:hover{border-color:var(--accent)}
.mic:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mic[data-listening="true"]{border-color:var(--accent);color:var(--accent)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<header id="menu">
  <div class="menu-row" id="menuRow"></div>
  <button id="viewBtn" type="button" aria-label="View options" aria-expanded="false" aria-controls="viewPanel" title="View options">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="3.5" y1="8" x2="20.5" y2="8"/><line x1="3.5" y1="16" x2="20.5" y2="16"/>
      <circle cx="9" cy="8" r="2.6" fill="var(--bg)"/><circle cx="15" cy="16" r="2.6" fill="var(--bg)"/>
    </svg>
  </button>
  <div id="viewPanel" role="dialog" aria-modal="false" aria-labelledby="viewTitle" tabindex="-1" hidden>
    <h2 id="viewTitle">View</h2>
    <button class="view-switch" type="button" role="switch" aria-checked="true" aria-label="Show favourites" data-region="menu">Favourites<span class="sw" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span></button>
    <button class="view-switch" type="button" role="switch" aria-checked="true" aria-label="Show instructions" data-region="hint">Instructions<span class="sw" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span></button>
    <button class="view-switch" type="button" role="switch" aria-checked="true" aria-label="Show footer buttons" data-region="foot">Footer<span class="sw" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span></button>
    <div class="presets">
      <button class="preset" type="button" data-preset="everything" title="Ctrl+Shift+1">Everything</button>
      <button class="preset" type="button" data-preset="calm" title="Ctrl+Shift+2">Calm</button>
      <button class="preset" type="button" data-preset="search" title="Ctrl+Shift+3">Search only</button>
    </div>
  </div>
</header>

<main>
  <div class="search-wrap">
    <div class="wordmark" aria-hidden="true">
      <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>
    <form id="searchForm" action="https://www.google.com/search" method="get" autocomplete="on">
      <input type="text" id="q" name="q" placeholder="Search the web" aria-label="Search the web" autofocus>
      <div class="wheel" id="wheel" role="radiogroup" aria-label="Search mode"></div>
    </form>
    <div class="hint">Press <b>/</b> to focus search &middot; <b>&larr;/&rarr;</b> to switch mode &middot; Click the + tile to add a link</div>
    <div id="ytHint">Press <b>G</b> to return to Google Mode.</div>
  </div>
</main>

<footer>
  <button id="themeBtn" type="button">Toggle theme</button>
  <button id="exportBtn" type="button">Export links</button>
  <button id="importBtn" type="button">Import links</button>
  <button id="homeBtn" type="button">Set as homepage</button>
  <button id="resetBtn" class="danger" type="button">Reset links</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</footer>

<div id="modal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add link</h2>
    <form id="linkForm">
      <div class="field">
        <label for="linkName">Name</label>
        <input type="text" id="linkName" placeholder="e.g. YouTube" required>
      </div>
      <div class="field">
        <label for="linkUrl">URL</label>
        <input type="text" id="linkUrl" placeholder="https://example.com" required>
      </div>
      <div class="field">
        <label>Image</label>
        <div class="file-row">
          <input type="file" id="imageFile" accept="image/*">
          <div class="preview" id="preview"><img id="previewImg" alt=""></div>
        </div>
        <input type="text" id="imageUrl" placeholder="…or paste an image URL (e.g. file:///Users/you/pic.png)" style="display:none">
        <div style="font-size:12px;color:var(--muted);margin-top:6px" id="imgHint">Choose a file to embed it directly. Images are stored in the browser so the HTML stays a single file.</div>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancelLink">Cancel</button>
        <button type="submit" id="saveLink">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="homeModal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="homeTitle">
    <h2 id="homeTitle">Set as homepage</h2>
    <p class="home-note" id="homeNote"></p>
    <div class="field">
      <label for="homeUrl">Page address</label>
      <input type="text" id="homeUrl" readonly>
    </div>
    <ol class="home-steps" id="homeSteps"></ol>
    <details class="home-other" id="homeOther">
      <summary>Other browsers</summary>
      <div id="homeOtherList"></div>
    </details>
    <div class="modal-actions">
      <button type="button" id="closeHome">Close</button>
      <button type="button" id="copyHome">Copy address</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

var menuRow=document.getElementById("menuRow");
var searchForm=document.getElementById("searchForm");
var qInput=document.getElementById("q");
var wheel=document.getElementById("wheel");
var toast=document.getElementById("toast");
var modal=document.getElementById("modal");
var linkForm=document.getElementById("linkForm");
var linkName=document.getElementById("linkName");
var linkUrl=document.getElementById("linkUrl");
var imageFile=document.getElementById("imageFile");
var imageUrl=document.getElementById("imageUrl");
var preview=document.getElementById("preview");
var previewImg=document.getElementById("previewImg");
var modalTitle=document.getElementById("modalTitle");
var imgHint=document.getElementById("imgHint");

function letterTile(letter,color,bg){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96">'+
    '<rect width="96" height="96" rx="18" fill="'+bg+'"/>'+
    '<text x="48" y="61" font-family="system-ui,sans-serif" font-size="36" font-weight="700" fill="'+color+'" text-anchor="middle">'+letter+'</text></svg>';
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}

function load(){
  var saved=null;
  try{saved=localStorage.getItem(LS_LINKS);}catch(e){}
  if(saved){
    try{links=JSON.parse(saved);}catch(e){links=JSON.parse(JSON.stringify(DEFAULT_LINKS));}
  }else{
    links=JSON.parse(JSON.stringify(DEFAULT_LINKS));
    save();
  }
  var theme=null;
  try{theme=localStorage.getItem(LS_THEME);}catch(e){}
  if(theme==="light"){document.body.classList.add("theme-light");}
  var mode=null;
  try{mode=localStorage.getItem(LS_MODE);}catch(e){}
  if(mode!==null&&!isNaN(parseInt(mode,10))){
    var m=parseInt(mode,10);
    if(m>=0&&m<MODES.length){activeMode=m;}
  }
  var yt=null;
  try{yt=localStorage.getItem(LS_YT);}catch(e){}
  if(yt==="1"){ytMode=true;document.body.classList.add("yt-mode");}
  var view=null;
  try{view=localStorage.getItem(LS_VIEW);}catch(e){}
  if(view){
    var vp=view.split(",");
    if(vp.length===3){
      viewState={menu:vp[0]==="1",hint:vp[1]==="1",foot:vp[2]==="1"};
    }
  }
}

function save(){
  try{
    localStorage.setItem(LS_LINKS,JSON.stringify(links));
  }catch(e){
    alert("Storage is full. Remove an image or link, then try again.");
  }
}

function openUrl(url){
  var a=document.createElement("a");
  a.href=url;
  a.target="_blank";
  a.rel="noopener noreferrer";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function renderWheel(){
  wheel.innerHTML="";
  if(ytMode){
    var b=document.createElement("button");
    b.type="button";
    b.className="wheel-seg active";
    b.setAttribute("role","radio");
    b.setAttribute("aria-checked","true");
    b.setAttribute("aria-label","Search with YouTube");
    b.title="YouTube";
    var ic=document.createElement("span");
    ic.className="wicon";
    ic.innerHTML=YT_ICON;
    var lb=document.createElement("span");
    lb.className="wlabel";
    lb.textContent="YouTube";
    b.appendChild(ic);
    b.appendChild(lb);
    b.addEventListener("click",function(ev){
      ev.preventDefault();
      searchForm.requestSubmit();
    });
    wheel.appendChild(b);
    return;
  }
  MODES.forEach(function(m,i){
    var b=document.createElement("button");
    b.type="button";
    b.className="wheel-seg"+(i===activeMode?" active":"");
    b.setAttribute("role","radio");
    b.setAttribute("aria-checked",i===activeMode?"true":"false");
    b.setAttribute("aria-label","Search with "+m.label);
    b.title=m.label;
    var ic=document.createElement("span");
    ic.className="wicon";
    ic.innerHTML=MODE_ICONS[m.key];
    var lb=document.createElement("span");
    lb.className="wlabel";
    lb.textContent=m.label;
    b.appendChild(ic);
    b.appendChild(lb);
    b.addEventListener("click",function(ev){
      ev.preventDefault();
      if(i===activeMode){
        searchForm.requestSubmit();
      }else{
        setMode(i);
        qInput.focus();
      }
    });
    wheel.appendChild(b);
  });
}

function setMode(i){
  activeMode=i;
  try{localStorage.setItem(LS_MODE,String(i));}catch(e){}
  renderWheel();
}

function setYt(on){
  ytMode=!!on;
  try{localStorage.setItem(LS_YT,ytMode?"1":"0");}catch(e){}
  document.body.classList.toggle("yt-mode",ytMode);
  renderWheel();
}

function rotateMode(dir){
  if(ytMode)return;
  var n=MODES.length;
  setMode(((activeMode+dir)%n+n)%n);
  var seg=wheel.querySelector(".wheel-seg.active");
  if(seg){seg.focus();}
}

function copyToClipboard(text){
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";
    ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(fallback);
  }else{
    fallback();
  }
}

function showToast(msg){
  toast.textContent=msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.classList.remove("show");},2600);
}

function render(){
  menuRow.innerHTML="";
  links.forEach(function(l,i){
    var tile=document.createElement("div");
    tile.className="tile";
    tile.title=l.url;
    tile.addEventListener("click",function(ev){
      if(ev.target.closest(".tool"))return;
      openUrl(l.url);
    });

    var icon=document.createElement("div");
    icon.className="icon";
    var img=document.createElement("img");
    if(l.img){
      img.src=l.img;
    }else{
      img.src=letterTile(l.letter||(l.name?l.name.charAt(0):"?"),l.color||"#000000");
    }
    img.alt="";
    icon.appendChild(img);

    var label=document.createElement("span");
    label.className="label";
    label.textContent=l.name;

    var ed=document.createElement("button");
    ed.className="tool edit";
    ed.textContent="\u270E";
    ed.setAttribute("aria-label","Edit "+l.name);
    ed.addEventListener("click",function(ev){ev.stopPropagation();openEdit(i);});

    var del=document.createElement("button");
    del.className="tool delete";
    del.textContent="\u00D7";
    del.setAttribute("aria-label","Delete "+l.name);
    del.addEventListener("click",function(ev){ev.stopPropagation();deleteLink(i);});

    tile.appendChild(icon);
    tile.appendChild(label);
    tile.appendChild(ed);
    tile.appendChild(del);
    menuRow.appendChild(tile);
  });

  var add=document.createElement("div");
  add.className="tile add";
  add.addEventListener("click",function(){openAdd();});
  var addIcon=document.createElement("div");
  addIcon.className="icon";
  addIcon.textContent="+";
  var addLabel=document.createElement("span");
  addLabel.className="label";
  addLabel.textContent="Add";
  add.appendChild(addIcon);
  add.appendChild(addLabel);
  menuRow.appendChild(add);
}

function normalizeUrl(u){
  u=u.trim();
  if(!u)return "";
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)){
    u="https://"+u;
  }
  return u;
}

function openAdd(){
  editingId=null;
  modalTitle.textContent="Add link";
  linkForm.reset();
  embeddedData="";
  preview.style.display="none";
  imageUrl.value="";
  imageUrl.style.display="none";
  imgHint.textContent="Choose a file to embed it directly. Images are stored in the browser so the HTML stays a single file.";
  modal.classList.add("open");
  linkName.focus();
}

function openEdit(i){
  var l=links[i];
  editingId=i;
  modalTitle.textContent="Edit link";
  linkForm.reset();
  embeddedData=l.img||"";
  linkName.value=l.name||"";
  linkUrl.value=l.url||"";
  imageUrl.style.display="block";
  imageUrl.value="";
  if(embeddedData&&embeddedData.indexOf("data:")===0){
    preview.style.display="flex";
    previewImg.src=embeddedData;
    imgHint.textContent="A file is currently embedded. Choose a new file to replace it, or paste a URL below to use instead.";
  }else if(embeddedData){
    imageUrl.value=embeddedData;
    preview.style.display="none";
    imgHint.textContent="Currently using an image URL. Choose a file to embed it directly instead.";
  }else{
    preview.style.display="none";
    imgHint.textContent="Choose a file to embed it directly. Images are stored in the browser so the HTML stays a single file.";
  }
  modal.classList.add("open");
  linkName.focus();
}

function deleteLink(i){
  var l=links[i];
  if(confirm('Delete "'+(l.name||l.url)+'"?')){
    links.splice(i,1);
    save();
    render();
  }
}

function closeModal(){
  modal.classList.remove("open");
}

linkForm.addEventListener("submit",function(ev){
  ev.preventDefault();
  var name=linkName.value.trim();
  var url=normalizeUrl(linkUrl.value);
  if(!name){alert("Please enter a name.");return;}
  if(!url){alert("Please enter a URL.");return;}
  var img=embeddedData||imageUrl.value.trim();
  var obj={name:name,url:url};
  if(img){obj.img=img;}
  if(editingId!==null){
    var old=links[editingId];
    obj.letter=old.letter;
    obj.color=old.color;
    links[editingId]=obj;
  }else{
    links.push(obj);
  }
  save();
  render();
  closeModal();
});

document.getElementById("cancelLink").addEventListener("click",closeModal);
modal.addEventListener("click",function(ev){
  if(ev.target===modal)closeModal();
});

imageFile.addEventListener("change",function(){
  var f=imageFile.files[0];
  if(!f)return;
  if(!f.type||f.type.indexOf("image/")!==0){
    alert("Please choose an image file.");
    imageFile.value="";
    return;
  }
  if(f.size>MAX_EMBED){
    alert("Image is larger than 3 MB and can't be embedded reliably. Please resize it, or paste a file:// image URL below instead.");
    imageFile.value="";
    return;
  }
  if(f.size>1500000){
    imgHint.textContent="Note: this image is large and may fill storage quickly.";
  }
  var reader=new FileReader();
  reader.onload=function(){
    embeddedData=reader.result;
    preview.style.display="flex";
    previewImg.src=embeddedData;
    imageUrl.value="";
    imageUrl.style.display="block";
    imgHint.textContent="Embedded ("+Math.round(f.size/1024)+" KB). Choose a new file or paste a URL to replace it.";
  };
  reader.onerror=function(){alert("Could not read that file.");imageFile.value="";};
  reader.readAsDataURL(f);
});

searchForm.addEventListener("submit",function(ev){
  ev.preventDefault();
  var v=qInput.value.trim();
  if(!v){qInput.focus();return;}
  var q=qInput.value;
  var mode=MODES[activeMode]||MODES[0];
  setTimeout(function(){qInput.value="";},0);
  if(ytMode){
    window.location.href="https://www.youtube.com/results?search_query="+encodeURIComponent(q);
    return;
  }
  if(mode.key==="gemini"){
    copyToClipboard(q);
    showToast("Query copied to clipboard \u2014 opening Gemini");
    window.location.href="https://gemini.google.com/app";
    return;
  }
  window.location.href=mode.build(q);
});

document.addEventListener("keydown",function(ev){
  var t=ev.target;
  var typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA");
  if(ev.key==="Escape"&&homeModal.classList.contains("open")){closeHome();return;}
  if(ev.key==="Escape"&&modal.classList.contains("open")){closeModal();return;}
  if(!typing&&!modal.classList.contains("open")&&!homeModal.classList.contains("open")){
    if(ev.key==="ArrowRight"){ev.preventDefault();rotateMode(1);return;}
    if(ev.key==="ArrowLeft"){ev.preventDefault();rotateMode(-1);return;}
    if(ev.key==="y"||ev.key==="Y"){ev.preventDefault();setYt(true);qInput.focus();return;}
    if(ev.key==="g"||ev.key==="G"){ev.preventDefault();setYt(false);qInput.focus();return;}
  }
  if(ev.key==="/"&&!typing){
    ev.preventDefault();
    qInput.focus();
  }
});

document.getElementById("themeBtn").addEventListener("click",function(){
  var light=document.body.classList.toggle("theme-light");
  try{localStorage.setItem(LS_THEME,light?"light":"dark");}catch(e){}
});

document.getElementById("exportBtn").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify(links,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="homepage-links.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
});

document.getElementById("importBtn").addEventListener("click",function(){
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change",function(){
  var f=importFile.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!Array.isArray(data))throw new Error("bad format");
      links=data;
      save();
      render();
      alert("Imported "+data.length+" links.");
    }catch(e){
      alert("That file is not a valid homepage links file.");
    }
  };
  reader.readAsText(f);
  importFile.value="";
});

document.getElementById("resetBtn").addEventListener("click",function(){
  if(confirm("Remove all custom links and restore the defaults?")){
    links=JSON.parse(JSON.stringify(DEFAULT_LINKS));
    save();
    render();
  }
});

function homeAddress(){
  if(location.protocol==="http:"||location.protocol==="https:"){
    return location.protocol+"//"+location.host+location.pathname;
  }
  return location.href.split("#")[0].split("?")[0];
}

function detectBrowser(){
  var ua=navigator.userAgent||"";
  if(/MSIE |Trident\//.test(ua))return "ie";
  if(/DuckDuckGo|Ddg\//i.test(ua))return "duckduckgo";
  if(navigator.brave)return "brave";
  if(/Firefox\/|FxiOS\//.test(ua))return "firefox";
  if(/Edg(e|A|iOS)?\//.test(ua))return "edge";
  if(/Chrome\/|Chromium\/|CriOS\//.test(ua)){
    var brands=navigator.userAgentData&&navigator.userAgentData.brands;
    if(brands&&brands.length){
      for(var i=0;i<brands.length;i++){
        if(brands[i].brand==="Google Chrome")return "chrome";
      }
      return "chromium";
    }
    return /Chromium\//.test(ua)?"chromium":"chrome";
  }
  if(/Safari\//.test(ua))return "safari";
  return "";
}

function trySetHomePage(btn,url){
  if(detectBrowser()!=="ie")return false;
  try{
    btn.style.behavior="url(#default#homepage)";
    if(typeof btn.setHomePage==="undefined")return false;
    btn.setHomePage(url);
    return true;
  }catch(e){
    return false;
  }
}

function stepsHtml(steps){
  var out="";
  for(var i=0;i<steps.length;i++){out+="<li>"+steps[i]+"</li>";}
  return out;
}

function openHome(){
  var current=detectBrowser();
  var guide=null;
  var others="";
  for(var i=0;i<HOME_GUIDES.length;i++){
    var g=HOME_GUIDES[i];
    if(g.key===current){guide=g;continue;}
    others+="<p><b>"+g.name+"</b></p><ol class=\"home-steps\">"+stepsHtml(g.steps)+"</ol>";
  }
  homeUrl.value=homeAddress();
  document.getElementById("homeNote").textContent=guide
    ?"Browsers don't let a page change your homepage for you. Copy the address, then follow these steps in "+guide.name+"."
    :"Browsers don't let a page change your homepage for you. Copy the address, then follow the steps for your browser.";
  homeSteps.innerHTML=guide?stepsHtml(guide.steps):"";
  homeSteps.style.display=guide?"":"none";
  document.getElementById("homeOtherList").innerHTML=others;
  document.getElementById("homeOther").open=!guide;
  homeModal.classList.add("open");
  homeUrl.focus();
  homeUrl.select();
}

function closeHome(){
  homeModal.classList.remove("open");
}

document.getElementById("homeBtn").addEventListener("click",function(){

  openHome();
});

/* ---------- View control: explicit, predictable, remembered ---------- */

var viewEls={
  menu:menuRow,
  hint:document.querySelector(".hint"),
  foot:document.querySelector("footer")
};
var ytHintEl=document.getElementById("ytHint");
var viewPanel=document.getElementById("viewPanel");
var viewBtn=document.getElementById("viewBtn");

var PRESETS={
  everything:{menu:true,hint:true,foot:true},
  calm:{menu:false,hint:false,foot:true},
  search:{menu:false,hint:false,foot:false}
};
var PRESET_ORDER=["everything","calm","search"];

function viewPresetName(){
  if(viewState.menu&&viewState.hint&&viewState.foot)return "everything";
  if(!viewState.menu&&!viewState.hint&&viewState.foot)return "calm";
  if(!viewState.menu&&!viewState.hint&&!viewState.foot)return "search";
  return "";
}

function viewVisibleCount(){
  return (viewState.menu?1:0)+(viewState.hint?1:0)+(viewState.foot?1:0);
}

function saveView(){
  try{localStorage.setItem(LS_VIEW,(viewState.menu?"1":"0")+","+(viewState.hint?"1":"0")+","+(viewState.foot?"1":"0"));}catch(e){}
}

function syncViewUI(){
  var sws=viewPanel.querySelectorAll(".view-switch");
  for(var i=0;i<sws.length;i++){
    var r=sws[i].getAttribute("data-region");
    sws[i].setAttribute("aria-checked",viewState[r]?"true":"false");
  }
  var name=viewPresetName();
  var ps=viewPanel.querySelectorAll(".preset");
  for(var j=0;j<ps.length;j++){
    var on=ps[j].getAttribute("data-preset")===name;
    ps[j].setAttribute("data-active",on?"true":"false");
    ps[j].setAttribute("aria-pressed",on?"true":"false");
  }
}

function applyView(st,announce,save){
  viewState={menu:!!st.menu,hint:!!st.hint,foot:!!st.foot};
  viewEls.menu.hidden=!viewState.menu;
  viewEls.hint.hidden=!viewState.hint;
  ytHintEl.hidden=!viewState.hint;
  viewEls.foot.hidden=!viewState.foot;
  syncViewUI();
  if(save!==false)saveView();
  if(announce)showToast(announce);
}

function viewAnnouncement(st){
  if(st.menu&&st.hint&&st.foot)return "Everything shown";
  if(!st.menu&&!st.hint&&!st.foot)return "Favourites, instructions and footer hidden";
  if(!st.menu&&!st.hint&&st.foot)return "Favourites and instructions hidden";
  return "Favourites "+(st.menu?"shown":"hidden")+", instructions "+(st.hint?"shown":"hidden")+", footer "+(st.foot?"shown":"hidden");
}

function openViewPanel(){
  viewPanel.hidden=false;
  viewBtn.setAttribute("aria-expanded","true");
  viewPanel.focus();
}

function closeViewPanel(returnFocus){
  if(viewPanel.hidden)return;
  viewPanel.hidden=true;
  viewBtn.setAttribute("aria-expanded","false");
  if(returnFocus)viewBtn.focus();
}

viewBtn.addEventListener("click",function(){
  if(viewPanel.hidden){openViewPanel();}else{closeViewPanel(true);}
});

document.addEventListener("click",function(ev){
  if(viewPanel.hidden)return;
  if(viewPanel.contains(ev.target)||viewBtn.contains(ev.target))return;
  closeViewPanel(false);
});

(function(){
  var LABEL={menu:"Favourites",hint:"Instructions",foot:"Footer buttons"};
  var sws=viewPanel.querySelectorAll(".view-switch");
  for(var i=0;i<sws.length;i++){
    sws[i].addEventListener("click",function(){
      var r=this.getAttribute("data-region");
      var next={menu:viewState.menu,hint:viewState.hint,foot:viewState.foot};
      next[r]=!next[r];
      applyView(next,LABEL[r]+(next[r]?" shown":" hidden"),true);
    });
  }
  var ps=viewPanel.querySelectorAll(".preset");
  for(var j=0;j<ps.length;j++){
    ps[j].addEventListener("click",function(){
      var p=PRESETS[this.getAttribute("data-preset")];
      applyView(p,viewAnnouncement(p),true);
    });
  }
})();

function viewFromUrl(){
  var m=/[?&]view=([^&#]*)/.exec(location.search);
  if(!m)return "";
  var v=decodeURIComponent(m[1]).toLowerCase();
  v=v.replace(/[^a-z]+/g,"-");
  if(v==="all"||v==="everything")return "everything";
  if(v==="calm")return "calm";
  if(v==="search"||v==="search-only"||v==="searchonly")return "search";
  return "";
}

function isTypingTarget(t){
  return !!t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.isContentEditable);
}

document.addEventListener("keydown",function(ev){
  var modalOpen=modal.classList.contains("open")||homeModal.classList.contains("open");
  if(ev.key==="Escape"&&!modalOpen&&!viewPanel.hidden){
    ev.preventDefault();
    closeViewPanel(true);
    return;
  }
  var name="";
  if((ev.ctrlKey||ev.metaKey)&&ev.shiftKey){
    if(ev.code==="Digit1")name="everything";
    else if(ev.code==="Digit2")name="calm";
    else if(ev.code==="Digit3")name="search";
    if(name){
      ev.preventDefault();
      applyView(PRESETS[name],viewAnnouncement(PRESETS[name]),true);
    }
    return;
  }
  if(modalOpen||isTypingTarget(ev.target)||ev.altKey||ev.ctrlKey||ev.metaKey)return;
  if(ev.code==="Digit1")name="everything";
  else if(ev.code==="Digit2")name="calm";
  else if(ev.code==="Digit3")name="search";
  if(name){
    ev.preventDefault();
    applyView(PRESETS[name],viewAnnouncement(PRESETS[name]),true);
  }
});

/* Swipe on empty background: left shows less, right shows more. */
var touchOrigin=null;
document.addEventListener("touchstart",function(ev){
  touchOrigin=null;
  if(ev.touches.length!==1)return;
  var t=ev.target;
  if(t.closest&&t.closest("#menuRow,#viewPanel,button,input,form,#modal,#homeModal"))return;
  touchOrigin={x:ev.touches[0].clientX,y:ev.touches[0].clientY};
},{passive:true});

document.addEventListener("touchend",function(ev){
  if(!touchOrigin)return;
  var t=ev.changedTouches[0];
  var dx=t.clientX-touchOrigin.x;
  var dy=t.clientY-touchOrigin.y;
  touchOrigin=null;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
  var cur=viewPresetName();
  var idx=cur?PRESET_ORDER.indexOf(cur):-1;
  if(idx<0){
    var n=viewVisibleCount();
    idx=n>=3?0:(n>=1?1:2);
  }
  var next=idx+(dx<0?1:-1);
  if(next<0||next>=PRESET_ORDER.length)return;
  applyView(PRESETS[PRESET_ORDER[next]],viewAnnouncement(PRESETS[PRESET_ORDER[next]]),true);
},{passive:true});

/* ---------- On-device voice mode selection ---------- */

var SRClass=window.SpeechRecognition||window.webkitSpeechRecognition;
var voiceRec=null;
var micBtn=null;

function setVoiceStatus(s){
  try{document.documentElement.setAttribute("data-voice",s);}catch(e){}
}

function micMarkup(){
  return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>';
}

function removeMic(){
  if(voiceRec){try{voiceRec.abort();}catch(e){} voiceRec=null;}
  if(micBtn&&micBtn.parentNode)micBtn.parentNode.removeChild(micBtn);
  micBtn=null;
}

function setListening(on){
  if(!micBtn)return;
  micBtn.setAttribute("data-listening",on?"true":"false");
  micBtn.setAttribute("aria-label",on?"Stop listening":"Voice commands");
}

function buildMic(){
  if(micBtn)return;
  micBtn=document.createElement("button");
  micBtn.type="button";
  micBtn.id="micBtn";
  micBtn.className="mic";
  micBtn.innerHTML=micMarkup();
  micBtn.setAttribute("aria-label","Voice commands");
  micBtn.title="Voice commands";
  micBtn.addEventListener("click",toggleListen);
  searchForm.appendChild(micBtn);
}

function handleVoice(raw){
  var t=(raw||"").toLowerCase();
  if(!t)return;
  if(/\b(search only|only search|just search)\b/.test(t)){applyView(PRESETS.search,viewAnnouncement(PRESETS.search),true);return;}
  if(/\b(everything|show all)\b/.test(t)){applyView(PRESETS.everything,viewAnnouncement(PRESETS.everything),true);return;}
  if(/\bcalm\b/.test(t)){applyView(PRESETS.calm,viewAnnouncement(PRESETS.calm),true);return;}
  if(/\b(youtube|you tube)\b/.test(t)){setYt(true);showToast("Mode: YouTube");qInput.focus();return;}
  if(/\bgemini\b/.test(t)){setYt(false);setMode(1);showToast("Mode: Gemini");qInput.focus();return;}
  if(/\ball\b/.test(t)){setYt(false);setMode(2);showToast("Mode: All");qInput.focus();return;}
  if(/\b(google|web)\b/.test(t)){setYt(false);setMode(0);showToast("Mode: Google");qInput.focus();return;}
  showToast("Not recognised.");
}

function toggleListen(){
  if(voiceRec){try{voiceRec.stop();}catch(e){} return;}
  var r=null;
  try{r=new SRClass();}catch(e){removeMic();setVoiceStatus("unavailable");return;}
  try{r.processLocally=true;}catch(e){removeMic();setVoiceStatus("unavailable");return;}
  if(r.processLocally!==true){removeMic();setVoiceStatus("unavailable");return;}
  r.lang="en-US";
  r.interimResults=false;
  r.maxAlternatives=1;
  r.continuous=false;
  r.onresult=function(ev){
    var t="";
    for(var i=0;i<ev.results.length;i++){
      var alt=ev.results[i]&&ev.results[i][0];
      if(alt&&alt.transcript)t+=" "+alt.transcript;
    }
    handleVoice(t);
  };
  r.onerror=function(ev){
    setListening(false);
    var code=ev&&ev.error;
    if(code==="language-not-supported"){
      removeMic();
      setVoiceStatus("unavailable");
      showToast("Voice mode is not available in this browser.");
      return;
    }
    if(code==="not-allowed"||code==="service-not-allowed"){
      showToast("Microphone access was blocked.");
      return;
    }
    if(code!=="aborted"&&code!=="no-speech"){
      showToast("Voice input stopped.");
    }
  };
  r.onend=function(){
    voiceRec=null;
    setListening(false);
  };
  voiceRec=r;
  try{
    r.start();
    setListening(true);
    showToast("Listening");
  }catch(e){
    voiceRec=null;
    setListening(false);
    removeMic();
    setVoiceStatus("unavailable");
  }
}

function initVoice(){
  if(!SRClass||typeof SRClass.available!=="function"){setVoiceStatus("unsupported");return;}
  try{
    var probe=new SRClass();
    probe.processLocally=true;
    if(probe.processLocally!==true){setVoiceStatus("unsupported");return;}
  }catch(e){
    setVoiceStatus("unsupported");
    return;
  }
  var promise=null;
  try{
    promise=SRClass.available({langs:["en-US"],processLocally:true});
  }catch(e){
    setVoiceStatus("unavailable");
    return;
  }
  if(!promise||typeof promise.then!=="function"){setVoiceStatus("unavailable");return;}
  promise.then(function(status){
    setVoiceStatus(status);
    if(status==="available")buildMic();
  },function(){
    setVoiceStatus("unavailable");
  });
}

load();
var urlView=viewFromUrl();
if(urlView){applyView(PRESETS[urlView],false,false);}else{applyView(viewState,false,false);}
render();
renderWheel();
initVoice();
})();
</script>
