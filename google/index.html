<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
:root{
  --bg:#000000;
  --fg:#ffffff;
  --muted:#8a8a8a;
  --tile-bg:#ffffff;
  --tile-border:none;
  --tile-shadow:0 4px 14px rgba(255,255,255,.08);
  --accent:#ffde00;
  --input-bg:#000000;
  --input-fg:#ffffff;
  --input-border:#ffffff;
  --modal-bg:#000000;
  --overlay:rgba(0,0,0,.75);
  --danger:#ff3b30;
}
body.theme-light{
  --bg:#ffffff;
  --fg:#000000;
  --muted:#555555;
  --tile-bg:#ffffff;
  --tile-border:3px solid #000000;
  --tile-shadow:0 4px 12px rgba(0,0,0,.12);
  --accent:#0057ff;
  --input-bg:#ffffff;
  --input-fg:#000000;
  --input-border:#000000;
  --modal-bg:#ffffff;
  --overlay:rgba(0,0,0,.4);
  --danger:#d70015;
}
body.yt-mode{
  --accent:#ff0000;
  --danger:#ff0000;
}
body.yt-mode .wordmark span{color:#ff0000}
body.yt-mode .hint{display:none}
body.yt-mode #ytHint{display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;
  flex-direction:column;
  min-height:100%;
  transition:background .15s,color .15s;
}
header#menu{
  padding:26px 24px 10px;
}
.menu-row{
  display:flex;
  gap:18px;
  overflow-x:auto;
  padding-bottom:12px;
  scrollbar-width:thin;
}
.menu-row::-webkit-scrollbar{height:6px}
.menu-row::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px}
.tile{
  flex:0 0 auto;
  width:108px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  cursor:pointer;
  position:relative;
  user-select:none;
  -webkit-user-select:none;
}
.tile .icon{
  width:96px;
  height:96px;
  border-radius:22px;
  background:var(--tile-bg);
  border:var(--tile-border);
  box-shadow:var(--tile-shadow);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:transform .12s ease;
}
.tile:hover .icon{transform:scale(1.06)}
.tile .icon img{width:100%;height:100%;object-fit:contain;padding:10px;display:block}
.tile .label{
  max-width:108px;
  font-size:13px;
  font-weight:600;
  color:var(--fg);
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.tile.add .icon{
  background:transparent;
  border:3px dashed var(--fg);
  box-shadow:none;
  color:var(--fg);
  font-size:52px;
  font-weight:300;
  line-height:1;
}
.tile .tool{
  position:absolute;
  top:2px;
  width:26px;
  height:26px;
  border-radius:50%;
  border:2px solid var(--fg);
  background:var(--bg);
  color:var(--fg);
  font-weight:700;
  font-size:13px;
  line-height:1;
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:2;
}
.tile:hover .tool{display:flex}
.tile .tool.edit{right:8px}
.tile .tool.delete{left:8px;color:var(--danger);border-color:var(--danger)}
main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.search-wrap{
  width:100%;
  max-width:640px;
  text-align:center;
}
.wordmark{
  font-size:64px;
  font-weight:700;
  letter-spacing:-2px;
  margin-bottom:26px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.wordmark span:nth-child(1){color:#4285f4}
.wordmark span:nth-child(2){color:#ea4335}
.wordmark span:nth-child(3){color:#fbbc05}
.wordmark span:nth-child(4){color:#4285f4}
.wordmark span:nth-child(5){color:#34a853}
.wordmark span:nth-child(6){color:#ea4335}
#searchForm{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  align-items:center;
  justify-content:center;
}
#q{
  flex:1;
  padding:16px 22px;
  font-size:20px;
  color:var(--input-fg);
  background:var(--input-bg);
  border:3px solid var(--input-border);
  border-radius:999px;
  outline:none;
  min-width:0;
}
#q::placeholder{color:var(--muted)}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%, transparent)}
.wheel{
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:var(--input-bg);
  border:3px solid var(--input-border);
  border-radius:999px;
  padding:4px;
}
.wheel-seg{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 16px;
  border-radius:999px;
  border:2px solid transparent;
  background:transparent;
  color:var(--muted);
  font:inherit;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  transition:background .12s,color .12s,transform .12s;
}
.wheel-seg:hover{color:var(--fg)}
.wheel-seg.active{
  background:var(--accent);
  color:var(--bg);
  transform:scale(1.05);
}
.wheel-seg .wicon{display:inline-flex;align-items:center}
.wheel-seg .wlabel{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
}
.wheel-seg:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{margin-top:22px;font-size:12px;color:var(--muted);letter-spacing:.5px}
#ytHint{
  display:none;
  margin-top:10px;
  font-size:12px;
  color:var(--accent);
  letter-spacing:.5px;
}
#toast{
  position:fixed;
  bottom:26px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--fg);
  color:var(--bg);
  border-radius:999px;
  padding:12px 22px;
  font-size:14px;
  font-weight:600;
  text-align:center;
  max-width:90vw;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:100;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{
  padding:14px 24px 22px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
footer button{
  padding:8px 14px;
  font-size:13px;
  font-weight:600;
  color:var(--fg);
  background:transparent;
  border:2px solid var(--muted);
  border-radius:999px;
  cursor:pointer;
}
footer button:hover{border-color:var(--fg)}
footer button.danger:hover{border-color:var(--danger);color:var(--danger)}
#modal,#homeModal{
  position:fixed;
  inset:0;
  background:var(--overlay);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:16px;
}
#modal.open,#homeModal.open{display:flex}
.modal-box{
  background:var(--modal-bg);
  color:var(--fg);
  border:3px solid var(--fg);
  border-radius:18px;
  width:100%;
  max-width:460px;
  padding:26px;
}
.modal-box h2{font-size:22px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:6px;
  color:var(--muted);
}
.field input[type=text]{
  width:100%;
  padding:12px 14px;
  font-size:15px;
  color:var(--fg);
  background:var(--bg);
  border:2px solid var(--fg);
  border-radius:10px;
  outline:none;
}
.field input[type=text]:focus{border-color:var(--accent)}
.field .file-row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.file-row input[type=file]{font-size:13px;color:var(--muted)}
.preview{
  width:64px;height:64px;
  border-radius:12px;
  border:2px solid var(--fg);
  overflow:hidden;
  display:none;
  align-items:center;
  justify-content:center;
  background:var(--tile-bg);
}
.preview img{width:100%;height:100%;object-fit:contain;padding:6px;display:block}
#imageUrl{
  margin-top:8px;
}
.modal-actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:22px;
}
.modal-actions button{
  padding:11px 20px;
  font-size:15px;
  font-weight:700;
  border:none;
  border-radius:999px;
  cursor:pointer;
}
#saveLink,#copyHome{background:var(--accent);color:var(--bg)}
#cancelLink,#closeHome{background:transparent;color:var(--fg);border:2px solid var(--fg)}
#homeModal .modal-box{max-height:100%;overflow-y:auto}
.home-note{font-size:14px;line-height:1.5;color:var(--muted);margin-bottom:16px}
.home-steps{margin:0 0 4px 20px;font-size:15px;line-height:1.5}
.home-steps li{margin-bottom:6px}
.home-steps code,.home-other code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.home-other{margin-top:14px;font-size:14px;color:var(--muted)}
.home-other summary{cursor:pointer;font-weight:700}
.home-other p{margin-top:10px;line-height:1.5}
.home-other b{color:var(--fg)}
@media (max-width:520px){
  .wordmark{font-size:46px}
  #searchForm{flex-direction:column}
  .wheel{width:100%;justify-content:center}
}
</style>
</head>
<body>

<header id="menu">
  <div class="menu-row" id="menuRow"></div>
</header>

<main>
  <div class="search-wrap">
    <div class="wordmark" aria-hidden="true">
      <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>
    <form id="searchForm" action="https://www.google.com/search" method="get" autocomplete="on">
      <input type="text" id="q" name="q" placeholder="Search the web" aria-label="Search the web" autofocus>
      <div class="wheel" id="wheel" role="radiogroup" aria-label="Search mode"></div>
    </form>
    <div class="hint">Press <b>/</b> to focus search &middot; <b>&larr;/&rarr;</b> to switch mode &middot; Click the + tile to add a link</div>
    <div id="ytHint">Press <b>G</b> to return to Google Mode.</div>
  </div>
</main>

<footer>
  <button id="themeBtn" type="button">Toggle theme</button>
  <button id="exportBtn" type="button">Export links</button>
  <button id="importBtn" type="button">Import links</button>
  <button id="homeBtn" type="button">Set as homepage</button>
  <button id="resetBtn" class="danger" type="button">Reset links</button>
  <input type="file" id="importFile" accept="application/json" hidden>
</footer>

<div id="modal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">Add link</h2>
    <form id="linkForm">
      <div class="field">
        <label for="linkName">Name</label>
        <input type="text" id="linkName" placeholder="e.g. YouTube" required>
      </div>
      <div class="field">
        <label for="linkUrl">URL</label>
        <input type="text" id="linkUrl" placeholder="https://example.com" required>
      </div>
      <div class="field">
        <label>Image</label>
        <div class="file-row">
          <input type="file" id="imageFile" accept="image/*">
          <div class="preview" id="preview"><img id="previewImg" alt=""></div>
        </div>
        <input type="text" id="imageUrl" placeholder="…or paste an image URL (e.g. file:///Users/you/pic.png)" style="display:none">
        <div style="font-size:12px;color:var(--muted);margin-top:6px" id="imgHint">Choose a file to embed it directly. Images are stored in the browser so the HTML stays a single file.</div>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancelLink">Cancel</button>
        <button type="submit" id="saveLink">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="homeModal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="homeTitle">
    <h2 id="homeTitle">Set as homepage</h2>
    <p class="home-note" id="homeNote"></p>
    <div class="field">
      <label for="homeUrl">Page address</label>
      <input type="text" id="homeUrl" readonly>
    </div>
    <ol class="home-steps" id="homeSteps"></ol>
    <details class="home-other" id="homeOther">
      <summary>Other browsers</summary>
      <div id="homeOtherList"></div>
    </details>
    <div class="modal-actions">
      <button type="button" id="closeHome">Close</button>
      <button type="button" id="copyHome">Copy address</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

var LS_LINKS="homepage.links";
var LS_THEME="homepage.theme";
var LS_MODE="homepage.mode";
var LS_YT="homepage.yt";
var MAX_EMBED=3000000;

var MODES=[
  {key:"web",label:"Google",build:function(q){return "https://www.google.com/search?q="+encodeURIComponent(q)+"&udm=14";}},
  {key:"gemini",label:"Gemini",build:function(q){return "https://gemini.google.com/app";}},
  {key:"all",label:"All",build:function(q){return "https://www.google.com/search?q="+encodeURIComponent(q);}}
];

var MODE_ICONS={
  web:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>',
  gemini:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2c1 6 4 9 10 10-6 1-9 4-10 10-1-6-4-9-10-10C8 11 11 8 12 2Z"/></svg>',
  all:'<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>'
};

var YT_ICON='<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21.6 7.2c-.2-1.1-.9-2-2-2.2C17.9 4.6 14 4.6 12 4.6s-5.9 0-7.6.4c-1.1.2-1.8 1.1-2 2.2-.3 1.4-.4 3.2-.4 4.8s.1 3.4.4 4.8c.2 1.1.9 2 2 2.2 1.7.4 5.6.4 7.6.4s5.9 0 7.6-.4c1.1-.2 1.8-1.1 2-2.2.3-1.4.4-3.2.4-4.8s-.1-3.4-.4-4.8zM9.8 15V9l5.4 3-5.4 3z"/></svg>';

var DEFAULT_LINKS=[
  {name:"Google",url:"https://www.google.com/",letter:"G",color:"#4285f4"},
  {name:"YouTube",url:"https://www.youtube.com/",letter:"Y",color:"#ff0000"},
  {name:"Gmail",url:"https://mail.google.com/",letter:"M",color:"#ea4335"},
  {name:"GitHub",url:"https://github.com/",letter:"GH",color:"#24292e"},
  {name:"Reddit",url:"https://www.reddit.com/",letter:"R",color:"#ff4500"},
  {name:"Wikipedia",url:"https://www.wikipedia.org/",letter:"W",color:"#636466"},
  {name:"X",url:"https://x.com/",letter:"X",color:"#000000"}
];

var links=[];
var editingId=null;
var embeddedData="";
var activeMode=0;
var ytMode=false;
var toastTimer=null;

var menuRow=document.getElementById("menuRow");
var searchForm=document.getElementById("searchForm");
var qInput=document.getElementById("q");
var wheel=document.getElementById("wheel");
var toast=document.getElementById("toast");
var modal=document.getElementById("modal");
var linkForm=document.getElementById("linkForm");
var linkName=document.getElementById("linkName");
var linkUrl=document.getElementById("linkUrl");
var imageFile=document.getElementById("imageFile");
var imageUrl=document.getElementById("imageUrl");
var preview=document.getElementById("preview");
var previewImg=document.getElementById("previewImg");
var modalTitle=document.getElementById("modalTitle");
var imgHint=document.getElementById("imgHint");

function letterTile(letter,color,bg){
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96">'+
    '<rect width="96" height="96" rx="18" fill="'+bg+'"/>'+
    '<text x="48" y="61" font-family="system-ui,sans-serif" font-size="36" font-weight="700" fill="'+color+'" text-anchor="middle">'+letter+'</text></svg>';
  return "data:image/svg+xml,"+encodeURIComponent(svg);
}

function load(){
  var saved=null;
  try{saved=localStorage.getItem(LS_LINKS);}catch(e){}
  if(saved){
    try{links=JSON.parse(saved);}catch(e){links=JSON.parse(JSON.stringify(DEFAULT_LINKS));}
  }else{
    links=JSON.parse(JSON.stringify(DEFAULT_LINKS));
    save();
  }
  var theme=null;
  try{theme=localStorage.getItem(LS_THEME);}catch(e){}
  if(theme==="light"){document.body.classList.add("theme-light");}
  var mode=null;
  try{mode=localStorage.getItem(LS_MODE);}catch(e){}
  if(mode!==null&&!isNaN(parseInt(mode,10))){
    var m=parseInt(mode,10);
    if(m>=0&&m<MODES.length){activeMode=m;}
  }
  var yt=null;
  try{yt=localStorage.getItem(LS_YT);}catch(e){}
  if(yt==="1"){ytMode=true;document.body.classList.add("yt-mode");}
}

function save(){
  try{
    localStorage.setItem(LS_LINKS,JSON.stringify(links));
  }catch(e){
    alert("Storage is full. Remove an image or link, then try again.");
  }
}

function openUrl(url){
  var a=document.createElement("a");
  a.href=url;
  a.target="_blank";
  a.rel="noopener noreferrer";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function renderWheel(){
  wheel.innerHTML="";
  if(ytMode){
    var b=document.createElement("button");
    b.type="button";
    b.className="wheel-seg active";
    b.setAttribute("role","radio");
    b.setAttribute("aria-checked","true");
    b.setAttribute("aria-label","Search with YouTube");
    b.title="YouTube";
    var ic=document.createElement("span");
    ic.className="wicon";
    ic.innerHTML=YT_ICON;
    var lb=document.createElement("span");
    lb.className="wlabel";
    lb.textContent="YouTube";
    b.appendChild(ic);
    b.appendChild(lb);
    b.addEventListener("click",function(ev){
      ev.preventDefault();
      searchForm.requestSubmit();
    });
    wheel.appendChild(b);
    return;
  }
  MODES.forEach(function(m,i){
    var b=document.createElement("button");
    b.type="button";
    b.className="wheel-seg"+(i===activeMode?" active":"");
    b.setAttribute("role","radio");
    b.setAttribute("aria-checked",i===activeMode?"true":"false");
    b.setAttribute("aria-label","Search with "+m.label);
    b.title=m.label;
    var ic=document.createElement("span");
    ic.className="wicon";
    ic.innerHTML=MODE_ICONS[m.key];
    var lb=document.createElement("span");
    lb.className="wlabel";
    lb.textContent=m.label;
    b.appendChild(ic);
    b.appendChild(lb);
    b.addEventListener("click",function(ev){
      ev.preventDefault();
      if(i===activeMode){
        searchForm.requestSubmit();
      }else{
        setMode(i);
        qInput.focus();
      }
    });
    wheel.appendChild(b);
  });
}

function setMode(i){
  activeMode=i;
  try{localStorage.setItem(LS_MODE,String(i));}catch(e){}
  renderWheel();
}

function setYt(on){
  ytMode=!!on;
  try{localStorage.setItem(LS_YT,ytMode?"1":"0");}catch(e){}
  document.body.classList.toggle("yt-mode",ytMode);
  renderWheel();
}

function rotateMode(dir){
  if(ytMode)return;
  var n=MODES.length;
  setMode(((activeMode+dir)%n+n)%n);
  var seg=wheel.querySelector(".wheel-seg.active");
  if(seg){seg.focus();}
}

function copyToClipboard(text){
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=text;
    ta.style.position="fixed";
    ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(fallback);
  }else{
    fallback();
  }
}

function showToast(msg){
  toast.textContent=msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toast.classList.remove("show");},2600);
}

function render(){
  menuRow.innerHTML="";
  links.forEach(function(l,i){
    var tile=document.createElement("div");
    tile.className="tile";
    tile.title=l.url;
    tile.addEventListener("click",function(ev){
      if(ev.target.closest(".tool"))return;
      openUrl(l.url);
    });

    var icon=document.createElement("div");
    icon.className="icon";
    var img=document.createElement("img");
    if(l.img){
      img.src=l.img;
    }else{
      img.src=letterTile(l.letter||(l.name?l.name.charAt(0):"?"),l.color||"#000000");
    }
    img.alt="";
    icon.appendChild(img);

    var label=document.createElement("span");
    label.className="label";
    label.textContent=l.name;

    var ed=document.createElement("button");
    ed.className="tool edit";
    ed.textContent="\u270E";
    ed.setAttribute("aria-label","Edit "+l.name);
    ed.addEventListener("click",function(ev){ev.stopPropagation();openEdit(i);});

    var del=document.createElement("button");
    del.className="tool delete";
    del.textContent="\u00D7";
    del.setAttribute("aria-label","Delete "+l.name);
    del.addEventListener("click",function(ev){ev.stopPropagation();deleteLink(i);});

    tile.appendChild(icon);
    tile.appendChild(label);
    tile.appendChild(ed);
    tile.appendChild(del);
    menuRow.appendChild(tile);
  });

  var add=document.createElement("div");
  add.className="tile add";
  add.addEventListener("click",function(){openAdd();});
  var addIcon=document.createElement("div");
  addIcon.className="icon";
  addIcon.textContent="+";
  var addLabel=document.createElement("span");
  addLabel.className="label";
  addLabel.textContent="Add";
  add.appendChild(addIcon);
  add.appendChild(addLabel);
  menuRow.appendChild(add);
}

function normalizeUrl(u){
  u=u.trim();
  if(!u)return "";
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)){
    u="https://"+u;
  }
  return u;
}

function openAdd(){
  editingId=null;
  modalTitle.textContent="Add link";
  linkForm.reset();
  embeddedData="";
  preview.style.display="none";
  imageUrl.value="";
  imageUrl.style.display="none";
  imgHint.textContent="Choose a file to embed it directly. Images are stored in the browser so the HTML stays a single file.";
  modal.classList.add("open");
  linkName.focus();
}

function openEdit(i){
  var l=links[i];
  editingId=i;
  modalTitle.textContent="Edit link";
  linkForm.reset();
  embeddedData=l.img||"";
  linkName.value=l.name||"";
  linkUrl.value=l.url||"";
  imageUrl.style.display="block";
  imageUrl.value="";
  if(embeddedData&&embeddedData.indexOf("data:")===0){
    preview.style.display="flex";
    previewImg.src=embeddedData;
    imgHint.textContent="A file is currently embedded. Choose a new file to replace it, or paste a URL below to use instead.";
  }else if(embeddedData){
    imageUrl.value=embeddedData;
    preview.style.display="none";
    imgHint.textContent="Currently using an image URL. Choose a file to embed it directly instead.";
  }else{
    preview.style.display="none";
    imgHint.textContent="Choose a file to embed it directly. Images are stored in the browser so the HTML stays a single file.";
  }
  modal.classList.add("open");
  linkName.focus();
}

function deleteLink(i){
  var l=links[i];
  if(confirm('Delete "'+(l.name||l.url)+'"?')){
    links.splice(i,1);
    save();
    render();
  }
}

function closeModal(){
  modal.classList.remove("open");
}

linkForm.addEventListener("submit",function(ev){
  ev.preventDefault();
  var name=linkName.value.trim();
  var url=normalizeUrl(linkUrl.value);
  if(!name){alert("Please enter a name.");return;}
  if(!url){alert("Please enter a URL.");return;}
  var img=embeddedData||imageUrl.value.trim();
  var obj={name:name,url:url};
  if(img){obj.img=img;}
  if(editingId!==null){
    var old=links[editingId];
    obj.letter=old.letter;
    obj.color=old.color;
    links[editingId]=obj;
  }else{
    links.push(obj);
  }
  save();
  render();
  closeModal();
});

document.getElementById("cancelLink").addEventListener("click",closeModal);
modal.addEventListener("click",function(ev){
  if(ev.target===modal)closeModal();
});

imageFile.addEventListener("change",function(){
  var f=imageFile.files[0];
  if(!f)return;
  if(!f.type||f.type.indexOf("image/")!==0){
    alert("Please choose an image file.");
    imageFile.value="";
    return;
  }
  if(f.size>MAX_EMBED){
    alert("Image is larger than 3 MB and can't be embedded reliably. Please resize it, or paste a file:// image URL below instead.");
    imageFile.value="";
    return;
  }
  if(f.size>1500000){
    imgHint.textContent="Note: this image is large and may fill storage quickly.";
  }
  var reader=new FileReader();
  reader.onload=function(){
    embeddedData=reader.result;
    preview.style.display="flex";
    previewImg.src=embeddedData;
    imageUrl.value="";
    imageUrl.style.display="block";
    imgHint.textContent="Embedded ("+Math.round(f.size/1024)+" KB). Choose a new file or paste a URL to replace it.";
  };
  reader.onerror=function(){alert("Could not read that file.");imageFile.value="";};
  reader.readAsDataURL(f);
});

searchForm.addEventListener("submit",function(ev){
  ev.preventDefault();
  var v=qInput.value.trim();
  if(!v){qInput.focus();return;}
  var q=qInput.value;
  var mode=MODES[activeMode]||MODES[0];
  setTimeout(function(){qInput.value="";},0);
  if(ytMode){
    window.location.href="https://www.youtube.com/results?search_query="+encodeURIComponent(q);
    return;
  }
  if(mode.key==="gemini"){
    copyToClipboard(q);
    showToast("Query copied to clipboard \u2014 opening Gemini");
    window.location.href="https://gemini.google.com/app";
    return;
  }
  window.location.href=mode.build(q);
});

document.addEventListener("keydown",function(ev){
  var t=ev.target;
  var typing=t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA");
  if(ev.key==="Escape"&&homeModal.classList.contains("open")){closeHome();return;}
  if(ev.key==="Escape"&&modal.classList.contains("open")){closeModal();return;}
  if(!typing&&!modal.classList.contains("open")&&!homeModal.classList.contains("open")){
    if(ev.key==="ArrowRight"){ev.preventDefault();rotateMode(1);return;}
    if(ev.key==="ArrowLeft"){ev.preventDefault();rotateMode(-1);return;}
    if(ev.key==="y"||ev.key==="Y"){ev.preventDefault();setYt(true);qInput.focus();return;}
    if(ev.key==="g"||ev.key==="G"){ev.preventDefault();setYt(false);qInput.focus();return;}
  }
  if(ev.key==="/"&&!typing){
    ev.preventDefault();
    qInput.focus();
  }
});

document.getElementById("themeBtn").addEventListener("click",function(){
  var light=document.body.classList.toggle("theme-light");
  try{localStorage.setItem(LS_THEME,light?"light":"dark");}catch(e){}
});

document.getElementById("exportBtn").addEventListener("click",function(){
  var blob=new Blob([JSON.stringify(links,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="homepage-links.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
});

document.getElementById("importBtn").addEventListener("click",function(){
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change",function(){
  var f=importFile.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!Array.isArray(data))throw new Error("bad format");
      links=data;
      save();
      render();
      alert("Imported "+data.length+" links.");
    }catch(e){
      alert("That file is not a valid homepage links file.");
    }
  };
  reader.readAsText(f);
  importFile.value="";
});

document.getElementById("resetBtn").addEventListener("click",function(){
  if(confirm("Remove all custom links and restore the defaults?")){
    links=JSON.parse(JSON.stringify(DEFAULT_LINKS));
    save();
    render();
  }
});

function homeAddress(){
  if(location.protocol==="http:"||location.protocol==="https:"){
    return location.protocol+"//"+location.host+location.pathname;
  }
  return location.href.split("#")[0].split("?")[0];
}

function detectBrowser(){
  var ua=navigator.userAgent||"";
  if(/MSIE |Trident\//.test(ua))return "ie";
  if(/DuckDuckGo|Ddg\//i.test(ua))return "duckduckgo";
  if(navigator.brave)return "brave";
  if(/Firefox\/|FxiOS\//.test(ua))return "firefox";
  if(/Edg(e|A|iOS)?\//.test(ua))return "edge";
  if(/Chrome\/|Chromium\/|CriOS\//.test(ua)){
    var brands=navigator.userAgentData&&navigator.userAgentData.brands;
    if(brands&&brands.length){
      for(var i=0;i<brands.length;i++){
        if(brands[i].brand==="Google Chrome")return "chrome";
      }
      return "chromium";
    }
    return /Chromium\//.test(ua)?"chromium":"chrome";
  }
  if(/Safari\//.test(ua))return "safari";
  return "";
}

function trySetHomePage(btn,url){
  if(detectBrowser()!=="ie")return false;
  try{
    btn.style.behavior="url(#default#homepage)";
    if(typeof btn.setHomePage==="undefined")return false;
    btn.setHomePage(url);
    return true;
  }catch(e){
    return false;
  }
}

function stepsHtml(steps){
  var out="";
  for(var i=0;i<steps.length;i++){out+="<li>"+steps[i]+"</li>";}
  return out;
}

function openHome(){
  var current=detectBrowser();
  var guide=null;
  var others="";
  for(var i=0;i<HOME_GUIDES.length;i++){
    var g=HOME_GUIDES[i];
    if(g.key===current){guide=g;continue;}
    others+="<p><b>"+g.name+"</b></p><ol class=\"home-steps\">"+stepsHtml(g.steps)+"</ol>";
  }
  homeUrl.value=homeAddress();
  document.getElementById("homeNote").textContent=guide
    ?"Browsers don't let a page change your homepage for you. Copy the address, then follow these steps in "+guide.name+"."
    :"Browsers don't let a page change your homepage for you. Copy the address, then follow the steps for your browser.";
  homeSteps.innerHTML=guide?stepsHtml(guide.steps):"";
  homeSteps.style.display=guide?"":"none";
  document.getElementById("homeOtherList").innerHTML=others;
  document.getElementById("homeOther").open=!guide;
  homeModal.classList.add("open");
  homeUrl.focus();
  homeUrl.select();
}

function closeHome(){
  homeModal.classList.remove("open");
}
